name: TabiToken + GoRouter registration monitor

# Runs every 30 minutes via GitHub Actions (free), checking BOTH sites in one
# pass. State is carried between runs with actions/cache so notifications fire
# on CHANGES only.
# In your repo this file lives at: .github/workflows/monitor.yml
#
# IMPORTANT: every action used below is first-party (actions/*), so this runs
# even under the strictest repo policy ("Allow actions created by GitHub").

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch:          # manual "Run workflow" button for testing

permissions:
  contents: write             # needed by the keepalive step

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Restore last known state
        uses: actions/cache/restore@v4
        with:
          path: .monitor_state
          key: tabi-state-${{ github.run_id }}
          restore-keys: tabi-state-

      - name: Run the check
        run: python tabi_monitor.py
        env:
          MONITOR_PROXY: ${{ secrets.MONITOR_PROXY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Save state for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor_state
          key: tabi-state-${{ github.run_id }}

      - name: Upload last screenshots (one per site)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-screenshots
          path: monitor_last_*.png
          if-no-files-found: ignore

      # GitHub pauses schedules after ~60 days of repo inactivity. Pure-shell
      # keepalive (NO third-party action): push one empty commit if the newest
      # commit is older than 50 days, otherwise do nothing.
      - name: Keep the schedule alive
        if: always()
        run: |
          last=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          now=$(date +%s)
          if [ $((now - last)) -gt 4320000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: keep scheduled workflows active"
            git push
            echo "keepalive commit pushed"
          else
            echo "repo is fresh enough - no keepalive needed"
          fi
